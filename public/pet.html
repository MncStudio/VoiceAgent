<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceAgent · 桌面宠物</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #1c2333, #0e1220); color: #e8ecf4;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 1rem;
  }
  h1 { font-size: 1.1rem; }
  .sub { color: #93a0b4; font-size: .82rem; text-align: center; }
  .voicepet { background: #223; border-radius: 18px; padding: .6rem; box-shadow: 0 18px 60px rgba(0,0,0,.5); }
  .voicepet canvas { display: block; image-rendering: pixelated; }
  .voicepet select { margin-bottom: .4rem; width: 100%; background: #20273a; color: #fff; border: 1px solid #39435c; border-radius: 8px; padding: .3rem; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; align-items: center; }
  button { border: none; border-radius: 9px; padding: .5rem .85rem; font-size: .85rem; cursor: pointer; background: #5b6cf0; color: #fff; }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: #2c3550; color: #cdd7ea; }
  input[type=text] { border: 1px solid #39435c; border-radius: 9px; padding: .5rem .7rem; background: #20273a; color: #fff; min-width: 220px; }
  #status { font-size: .85rem; color: #9fb2d4; min-height: 1.2rem; }
</style>
</head>
<body>
  <h1>VoiceAgent · 桌面宠物</h1>
  <div class="sub">形象 = public/pets/*(AI 按 docs/pet-prompt.md 规范生成,放进即用);说话张嘴、等待眨眼。</div>
  <div id="petBox" class="voicepet"></div>
  <div class="row">
    <button id="wakeBtn">🎤 开始监听</button>
    <button id="speakBtn">🔊 让 TA 说一句</button>
  </div>
  <div class="row">
    <input id="text" type="text" placeholder="输入想让它说的话,回车发送">
    <button id="send">发送</button>
  </div>
  <div id="status">点「开始监听」说唤醒词,或直接发文字;首次发声需点一下页面(浏览器自动播放限制)</div>

  <script src="/voice-agent.js"></script>
  <script src="/voicepet.js"></script>
  <script>
  'use strict';
  const $ = (s) => document.querySelector(s);
  let pet;
  const agent = new VoiceAgent({
    onStateChange: (s) => { $('#status').textContent = s; $('#wakeBtn').textContent = agent.wakeActive ? '⏹ 停止监听' : '🎤 开始监听'; },
    onReply: (t) => { $('#status').textContent = '回答:' + t.slice(0, 40); },
    onError: (e) => { $('#status').textContent = '错误:' + e; },
  });
  pet = new VoicePet({ el: $('#petBox'), agent, size: 220 });
  window.__pet = pet; // 调试:可看 __pet._mode(grid/single)
  pet.init().catch((e) => { $('#status').textContent = '宠物:' + e.message; });

  $('#wakeBtn').addEventListener('click', () => {
    if (agent.wakeActive) { agent.stopWake(); return; }
    agent.startWake().catch((e) => { $('#status').textContent = '无法监听:' + e.message; });
  });
  const say = () => { const t = $('#text').value.trim(); if (t) { agent.askText(t); $('#text').value = ''; } };
  $('#speakBtn').addEventListener('click', () => agent.askText('你好呀,我是小能。'));
  $('#send').addEventListener('click', say);
  $('#text').addEventListener('keydown', (e) => { if (e.key === 'Enter') say(); });
  </script>
</body>
</html>
