name: digital-employee-voice

services:
  livekit:
    image: livekit/livekit-server:v1.9.12
    command: ["--config", "/etc/livekit.yaml"]
    network_mode: host
    user: "${VOICE_UID:-1000}:${VOICE_GID:-1000}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${LIVEKIT_CONFIG_FILE:-./deploy/livekit.yaml}:/etc/livekit.yaml:ro
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ulimits:
      nofile: { soft: 65536, hard: 65536 }

  voiceagent:
    image: digital-employee-voiceagent:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.23.3-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    network_mode: host
    user: "${VOICE_UID:-1000}:${VOICE_GID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      livekit: { condition: service_started }
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: "3001"
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:?Set browser-accessible LiveKit WSS URL}
      LIVEKIT_INTERNAL_URL: ws://127.0.0.1:7880
    volumes:
      # Mount the original dotenv file; do not bake credentials into the image.
      - ${VOICE_ENV_FILE:-./.env}:/app/.env:ro
      - ${VOICE_RUNTIME_DIR:-./.runtime/container}:/app/.runtime
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
