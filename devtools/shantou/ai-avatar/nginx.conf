# AI 小头像 · nginx 部署示例
# 把下面 server 块复制进你的 nginx 配置,改 root 和 server_name 后 reload。
# 目录:devtools/shantou/ai-avatar(内含 index.html / voice-agent.js / avatar.svg / base.svg)

server {
    listen 80;
    server_name ai-avatar.example.com;   # 改成你的域名或 IP

    root /Users/mnc/Documents/VoiceAgent/devtools/shantou/ai-avatar;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ---------------------------------------------------------------
    # 若想让 iframe 页与 VoiceAgent 后端「同源」(iframe src 不用带 baseUrl):
    # 取消下面注释,并把 proxy_pass 指向 VoiceAgent 后端(端口按配置,如 3000/30002)。
    # WS 需要 Upgrade/Connection 头(见下)。
    # ---------------------------------------------------------------
    # location /api {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_read_timeout 300s;
    # }
}
