# 小能 · nginx 部署示例
# 把下面 server 块复制进你的 nginx 配置,改 root 和 server_name 后 reload。
# 目录:devtools/shantou/ai-avatar(内含 index.html / voice-agent.js / ai-avatar.svg / base.svg)
# 正式服务器已通过 sigc-nginx 提供 HTTPS 和 /api 代理，本文件仅作为独立部署示例。

server {
    listen 80;
    server_name ai-avatar.example.com;   # 改成你的域名或 IP

    root /opt/jiashidun/sigc-exhibition/voice-agent/devtools/shantou/ai-avatar;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 与页面同源的 API / WebSocket 代理。浏览器麦克风需要 HTTPS，
    # 正式部署请在此 server 上配置证书或放到现有 HTTPS server 中。
    location /api {
        proxy_pass http://127.0.0.1:30002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
